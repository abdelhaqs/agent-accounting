name: Sync Reports from GCP to GitHub

on:
  schedule:
    # Run 30 minutes after each scheduled Cloud Run sync (00:30, 04:30, 08:30, 12:30, 16:30, 20:30 UTC)
    - cron: '30 0,4,8,12,16,20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  id-token: write # Required for Workload Identity Federation
  contents: write # Required to push committed reports

jobs:
  sync:
    name: Pull GCS Reports & Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Download Reports from GCS
        run: |
          mkdir -p docs/report
          echo "Scanning GCS buckets for reports..."
          for BUCKET in "agent-accounting-506719-zerion-raw-data" "agent-accounting-506719-agent-accounting-raw-data"; do
            if gcloud storage ls "gs://${BUCKET}/reports/" &>/dev/null; then
              echo "Downloading from gs://${BUCKET}/reports/..."
              gcloud storage cp -r "gs://${BUCKET}/reports/*" docs/report/ || true
              break
            fi
          done

      - name: Commit and Push New Reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/report/
          if git diff --staged --quiet; then
            echo "No new reports to commit."
          else
            git commit -m "docs(report): sync latest value check reports from GCP [skip ci]"
            git push origin main
          fi
