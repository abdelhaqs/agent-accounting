name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8 cuallee pandas

      - name: Secret Scan (Prevent credentials in repo)
        run: |
          echo "Checking for unmasked API keys or tracked .env files..."
          if git ls-files | grep -E '^\.env$|\.env\.local$'; then
            echo "ERROR: Tracked .env file detected!"
            exit 1
          fi

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=local_tests,venv,.venv,archive_downloads,Archive
          # Complexity check
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=130 --statistics --exclude=local_tests,venv,.venv,archive_downloads,Archive

      - name: Run Unit Tests & Data Quality Contracts
        run: |
          pytest tests/ -v
